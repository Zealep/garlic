spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    show-sql: false

logging:
  level:
    com.zealep.garlicbackend: DEBUG
    org.hibernate.SQL: DEBUG

garlic:
  instalacion:
    # empresa demo del seed (db/seed/R__seed_demo.sql)
    empresa-ruc: "00000000000"
  cors:
    # App Flutter web / dashboards en desarrollo
    allowed-origins: http://localhost:*,http://127.0.0.1:*
