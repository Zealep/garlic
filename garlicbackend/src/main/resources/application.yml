spring:
  application:
    name: garlicbackend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/garlic}
    username: ${DB_USER:garlic}
    password: ${DB_PASSWORD:garlic}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  data:
    web:
      pageable:
        max-page-size: 200

server:
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

garlic:
  acceso:
    # Clave para firmar los tokens (>= 32 caracteres). Vacia: una al azar por arranque (solo tests).
    jwt-secret: ${GARLIC_JWT_SECRET:}
    duracion-acceso: 8h
    # Sesion del celular: se renueva con cada uso; sin usar la app 30 dias hay que volver a entrar
    duracion-sesion: 30d
  storage:
    # Carpeta de evidencias (almacenamiento local). En produccion: volumen persistente o S3.
    directorio: ${GARLIC_STORAGE_DIR:./data/evidencias}
