# Garlic (compra de ajo) en un servidor que ya usa nginx: compras.agroguadalupe.com
# Archivo propio: no toca los otros sitios. Instalar:
#   cp nginx-compras.conf /etc/nginx/sites-available/compras.conf
#   ln -s /etc/nginx/sites-available/compras.conf /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#   certbot --nginx -d compras.agroguadalupe.com     (agrega el HTTPS a este mismo archivo)
server {
    listen 80;
    listen [::]:80;
    server_name compras.agroguadalupe.com;

    root /opt/garlic/deploy/web;
    index index.html;
    server_tokens off;

    # fotos de evidencia de hasta 10 MB (el backend rechaza lo mayor)
    client_max_body_size 15m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml text/plain;

    location ~ ^/(api/|instalacion/|actuator/health$) {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # la app nueva se toma al recargar; el resto (con hash) se puede cachear
    location = / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /index.html =404;
    }

    location ~ ^/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
