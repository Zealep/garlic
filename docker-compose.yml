name: app-garlic

services:
  db:
    image: postgres:16-alpine
    container_name: garlic-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-garlic}
      POSTGRES_USER: ${POSTGRES_USER:-garlic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garlic}
      TZ: America/Lima
      PGTZ: America/Lima
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # El esquema lo crea y versiona Flyway desde garlicbackend (src/main/resources/db)
      - garlic-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  garlic-db-data:
